<body><main>
<header><p class="muted">KKT Staging</p><h1>工资单</h1><p>员工可查阅自己的已复核工资单。薪资 Admin 可选择多份列印。</p></header>
<section id="login-panel"><form id="login">
<label for="email">Staging 登录邮箱</label><input id="email" type="email" autocomplete="username" required>
<label for="password">测试项目密码</label><input id="password" type="password" autocomplete="current-password" required>
<div class="flex"><button id="sign-in" type="submit">登录</button></div>
</form></section>
<p id="status" role="status" aria-live="polite"></p>
<section id="workspace" hidden>
<div class="flex"><strong id="viewer"></strong><button id="logout" type="button" class="secondary">登出</button></div>
<form id="lookup" class="flex"><label for="month">工资月份</label><input id="month" type="month" required><button type="submit" class="secondary">查看月份</button></form>
<div id="batch" class="flex" hidden><label><input id="select-all" type="checkbox">全选本月</label><button id="print-selected" type="button">列印所选</button></div>
<p id="print-help" class="muted">列印时也可选择另存为 PDF。受保护的链接只会向有权限的账号显示工资单。</p>
<div id="records"></div>
<label id="share-label" for="share-url" hidden>分享链接</label><input id="share-url" readonly hidden>
</section>
<div id="print-output"></div>
<p><a href="./ken-payroll-staging.html">返回 Staging 薪资预览</a></p>
</main>

<div class="signatures"><span>Employer’s Signature</span><span>Employee’s Signature</span></div>
</article></template>
<script>"use strict";
const get = id => document.getElementById(id);
const project = "https://qacmlpqtiwwmrypxnnlp.supabase.co";
const key = "sb_publishable_ksPgK2lE7Uqo-goo8GP2XQ_u_HyjRM7";
const org = "28900000-0000-0000-0000-000000000071";
const params = new URLSearchParams(location.search);
const sharedId = params.get("payslip");
const money = new Intl.NumberFormat("en-MY", {minimumFractionDigits: 2, maximumFractionDigits: 2});
let session = "";
let role = "";
let records = [];
let busy = false;
let sharedView = false;
const selections = new Set();
const printOut = get("print-output");
const say = message => { get("status").textContent = message; };

function setBusy(value) {
  busy = value;
  const controls = document.querySelectorAll("#login button, #logout, #lookup button");
  for (const control of controls) control.disabled = value;
  get("print-selected").disabled = value || selections.size === 0;
}
async function api(path, data) {
  const headers = {apikey: key, "Content-Type": "application/json"};
  if (session) headers.Authorization = "Bearer " + session;
  const result = await fetch(project + "/" + path, {
    method: "POST", headers, body: JSON.stringify(data), cache: "no-store",
    credentials: "omit", redirect: "error", signal: AbortSignal.timeout(12000),
  });
  if (!result.ok) throw new Error(String(result.status));
  if (result.status === 204) return null;
  return result.json();
}
async function rpc(name, input, query = "") {
  return api("rest/v1/rpc/" + name + query, {target_org: org, ...input});
}
function clearShare() {
  get("share-url").value = "";
  get("share-url").hidden = true;
  get("share-label").hidden = true;
}
function clearRecords() {
  records = [];
  selections.clear();
  get("records").replaceChildren();
  printOut.replaceChildren();
  get("select-all").checked = false;
  get("select-all").indeterminate = false;
  get("batch").hidden = true;
  clearShare();
}
function clearSession() {
  session = "";
  role = "";
  clearRecords();
  get("workspace").hidden = true;
  get("login-panel").hidden = false;
}
function handleFailure(error, fallback) {
  if (error.message === "401" || error.message === "403") {
    clearSession();
    say("登录已失效或此账号没有工资单权限。");
  } else say(fallback);
}
function makeButton(label, callback) {
  const item = document.createElement("button");
  item.type = "button";
  item.className = "secondary";
  item.textContent = label;
  item.addEventListener("click", () => { if (!busy) callback(); });
  return item;
}
function renderRecords() {
  const batch = role === "payroll_admin" && !sharedView && records.length > 0;
  get("batch").hidden = !batch;
  get("records").replaceChildren();
  for (const row of records) {
    const item = document.createElement("div");
    item.className = "record";
    const label = document.createElement("label");
    if (batch) {
      const box = document.createElement("input");
      box.type = "checkbox";
      box.value = row.payslip_id;
      box.checked = selections.has(row.payslip_id);
      box.addEventListener("change", () => {
        if (box.checked) selections.add(row.payslip_id);
        else selections.delete(row.payslip_id);
        syncSelections();
      });
      label.append(box, " ");
    }
    label.append(row.employee_ref + " · " + row.salary_month.slice(0, 7));
    const controls = document.createElement("div");
    controls.className = "flex";
    controls.append(makeButton("查看", () => showSlips([row])), makeButton("分享链接", () => share(row)),
      makeButton("列印", () => printSlips([row])));
    item.append(label, controls);
    get("records").append(item);
  }
  syncSelections();
}
function syncSelections() {
  const selectAll = get("select-all");
  selectAll.checked = records.length > 0 && selections.size === records.length;
  selectAll.indeterminate = selections.size > 0 && !selectAll.checked;
  get("print-selected").disabled = busy || selections.size === 0;
}
async function showMonth(selectedId = null) {
  clearRecords();
  sharedView = Boolean(selectedId);
  if (selectedId && !/^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$/i.test(selectedId)) throw Error("Invalid link");
  const target = selectedId ? {target_payslip: selectedId} : {target_month: get("month").value + "-01"};
  const result = [];
  const pageSize = 150;
  for (let offset = 0;; offset += pageSize) {
    const rows = await rpc("kkt_payroll_payslips", target, "?limit=" + pageSize + "&offset=" + offset);
    if (!Array.isArray(rows)) throw Error("Unexpected payroll response");
    result.push(...rows);
    if (rows.length < pageSize) break;
  }
  records = result;
  renderRecords();
  if (!records.length) say(selectedId ? "找不到该工资单，或此账号无权查阅。" : "此月份没有可查阅的已复核工资单。");
  else {
    say("可查阅工资单 " + records.length + " 份。");
    if (selectedId) showSlips(records);
  }
}
function tableRow(table, label, amounts) {
  const row = table.insertRow();
  const heading = document.createElement("th");
  heading.scope = "row";
  heading.textContent = label;
  row.append(heading);
  for (const value of amounts) row.insertCell().textContent = value == null ? "不适用" : money.format(value);
}
function showSlips(rows) {
  printOut.replaceChildren();
  for (const row of rows) {
    const sheet = get("slip").content.cloneNode(true);
    sheet.querySelector(".slip-meta").textContent = "Employee No. " + row.employee_ref + " · " + row.salary_month.slice(0, 7);
    const earnings = sheet.querySelector(".earnings");
    tableRow(earnings, "Basic Salary", [row.basic_salary]);
    tableRow(earnings, "Allowances", [row.allowances]);
    tableRow(earnings, "Overtime", [row.overtime]);
    tableRow(earnings, "Bonus & Other Earnings", [row.bonus_and_other_earnings]);
    tableRow(earnings, "Gross Pay", [row.gross_salary]);
    const deductions = sheet.querySelector(".deductions");
    tableRow(deductions, "EPF / KWSP", [row.epf_employee, row.epf_employer]);
    tableRow(deductions, "SOCSO / PERKESO", [row.socso_employee, row.socso_employer]);
    tableRow(deductions, "EIS / SIP", [row.eis_employee, row.eis_employer]);
    tableRow(deductions, "PCB / MTD", [row.pcb_employee, null]);
    tableRow(deductions, "Other Deductions", [row.other_deductions, null]);
    sheet.querySelector(".slip-net span:last-child").textContent = "RM " + money.format(row.net_salary);
    printOut.append(sheet);
  }
}
function printSlips(rows) {
  if (!rows.length) return;
  showSlips(rows);
  window.print();
}
async function share(row) {
  const url = new URL(location.pathname, location.origin);
  url.searchParams.set("payslip", row.payslip_id);
  clearShare();
  if (navigator.share) {
    try { await navigator.share({title: "KKT 工资单 · 需要登录", url: url.href}); return; }
    catch (error) { if (error.name === "AbortError") return; }
  }
  const field = get("share-url");
  field.value = url.href;
  field.hidden = false;
  get("share-label").hidden = false;
  field.select();
  say("请复制链接。收件人登录后仍须具备这份工资单的权限。");
}

get("month").value = new Intl.DateTimeFormat("sv-SE", {timeZone: "Asia/Kuala_Lumpur", year: "numeric", month: "2-digit"}).format(new Date());
get("login").addEventListener("submit", async event => {
  event.preventDefault();
  if (busy) return;
  setBusy(true);
  const password = get("password").value;
  get("password").value = "";
  try {
    const auth = await api("auth/v1/token?grant_type=password", {email: get("email").value.trim(), password});
    session = auth.access_token;
    if (!session) throw Error("401");
    role = await rpc("kkt_payroll_viewer_role", {});
    if (!["employee", "payroll_admin"].includes(role)) throw Error("403");
    get("viewer").textContent = role === "payroll_admin" ? "薪资 Admin" : "员工";
    get("login-panel").hidden = true;
    get("workspace").hidden = false;
    await showMonth(sharedId);
  } catch (error) {
    handleFailure(error, "暂时无法载入工资单，请重试。");
  } finally { setBusy(false); }
});
get("lookup").addEventListener("submit", async event => {
  event.preventDefault();
  if (busy || !session) return;
  setBusy(true);
  try { await showMonth(); }
  catch (error) { handleFailure(error, "暂时无法读取此月份，请重试。"); }
  finally { setBusy(false); }
});
get("logout").addEventListener("click", async () => {
  setBusy(true);
  try { await api("auth/v1/logout?scope=local", {}); }
  catch { /* Clear all local data even if the network is unavailable. */ }
  finally { clearSession(); say("已登出。"); setBusy(false); }
});
get("select-all").addEventListener("change", event => {
  if (busy || role !== "payroll_admin") return;
  selections.clear();
  if (event.target.checked) for (const row of records) selections.add(row.payslip_id);
  renderRecords();
});
get("print-selected").addEventListener("click", () => {
  if (!busy && role === "payroll_admin") printSlips(records.filter(row => selections.has(row.payslip_id)));
});
</script>
</body></html>
