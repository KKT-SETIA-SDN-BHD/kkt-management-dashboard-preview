name: Android Auth Staging Artifact
on:
  push:
    branches: [feature/pin-unlock-staging]
    paths:
      - android-auth-staging.html
      - .github/workflows/android-auth-staging-pages.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package isolated staging test page (no public deployment)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp android-auth-staging.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: android-auth-staging-site
          path: _site/
          retention-days: 7
