name: RC security tests (no deploy)
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/rc-security-tests.yml'
  push:
    branches: ['release/production-readonly-rc']
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/rc-security-tests.yml'
permissions:
  contents: read
jobs:
  release-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test fail-closed release guard
        run: node --test tests/*.test.mjs
