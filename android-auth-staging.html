<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://qacmlpqtiwwmrypxnnlp.supabase.co; base-uri 'none'; form-action 'none'"><title>KKT Android Auth Test · Staging</title><style>body{font:16px system-ui;background:#eef3f6;color:#152b40;display:grid;place-items:center;min-height:100dvh;margin:0;padding:18px}main{background:white;max-width:420px;width:100%;padding:26px;border-radius:18px;box-sizing:border-box}input,button{font:inherit;width:100%;box-sizing:border-box;padding:13px;border-radius:9px;margin:6px 0 15px}input{border:1px solid #9eacbb}button{border:0;background:#173b5b;color:white;font-weight:700}button:disabled{opacity:.6}small{color:#536779}#status{min-height:3em}</style></head><body><main><strong>KKT Dashboard · Staging</strong><h2>Android 首次登录测试</h2><p><small>仅验证 Supabase 账号；不连接 UBS、OneDrive 或真实业务数据。PIN 尚未启用。</small></p><form id="login"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="submit" type="submit">安全登录测试</button></form><button id="logout" type="button" hidden>结束测试</button><p id="status" role="status" aria-live="polite">尚未登录。</p><small>凭证仅发送至 KKT Staging Supabase Auth。此页面不保存会话、密码或令牌；关闭页面即结束本地测试。不要在聊天中发送密码。</small></main><script>'use strict';const URL='https://qacmlpqtiwwmrypxnnlp.supabase.co';const KEY="sb_publishable_ksPgK2lE7Uqo-goo8GP2XQ_u_HyjRM7";let token=null;const $=id=>document.getElementById(id);$('login').addEventListener('submit',async e=>{e.preventDefault();$('submit').disabled=true;$('status').textContent='验证中…';const email=$('email').value.trim(),password=$('password').value;try{const r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({email,password}),cache:'no-store',referrerPolicy:'no-referrer'});const d=await r.json();if(!r.ok||!d.access_token)throw new Error('登录未通过，请检查账号或密码。');token=d.access_token;const u=await fetch(URL+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+token},cache:'no-store',referrerPolicy:'no-referrer'});if(!u.ok)throw new Error('会话验证失败。');$('status').textContent='Staging 账号验证成功。此测试未开放业务数据。';$('login').hidden=true;$('logout').hidden=false;}catch(_){token=null;$('status').textContent='登录失败或网络不可用。未开放任何业务资料。';}finally{$('password').value='';$('submit').disabled=false;}});$('logout').addEventListener('click',async()=>{if(token){try{await fetch(URL+'/auth/v1/logout',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token},cache:'no-store',referrerPolicy:'no-referrer'});}catch(_){}}token=null;$('login').hidden=false;$('logout').hidden=true;$('status').textContent='测试会话已结束。';});</script></body></html>
